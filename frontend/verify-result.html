<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification Result - Authentic</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: #f1f5f9; color: #0f172a; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; }
        .result-container { background: white; width: 100%; max-width: 700px; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); overflow: hidden; border: 1px solid #e2e8f0; margin-bottom: 24px; }
        .header { background: #f8fafc; padding: 16px 24px; border-bottom: 1px solid #e2e8f0; font-weight: 700; font-size: 1.125rem; }
        .content { padding: 40px; text-align: center; }
        
        .icon-success { width: 64px; height: 64px; background: #16a34a; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 24px; color: white; }
        .icon-success svg { width: 32px; height: 32px; }
        
        .status-title { font-size: 2rem; font-weight: 700; color: #16a34a; margin-bottom: 12px; letter-spacing: -0.02em; }
        .status-desc { font-size: 0.875rem; color: #475569; max-width: 400px; margin: 0 auto 40px; line-height: 1.5; }
        
        .details-card { border: 1px solid #e2e8f0; border-radius: 8px; text-align: left; margin-bottom: 24px; }
        .dc-header { padding: 20px; display: flex; align-items: center; gap: 16px; border-bottom: 1px solid #e2e8f0; }
        .dc-avatar { width: 48px; height: 48px; background: #e2e8f0; border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #64748b; }
        .dc-name-label { font-size: 0.65rem; font-weight: 700; color: #64748b; margin-bottom: 4px; letter-spacing: 0.05em; }
        .dc-name-val { font-size: 1.25rem; font-weight: 700; }
        
        .dc-grid { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 1px solid #e2e8f0; }
        .dc-cell { padding: 16px 20px; border-right: 1px solid #e2e8f0; }
        .dc-cell:last-child { border-right: none; }
        .dc-label { font-size: 0.65rem; font-weight: 700; color: #64748b; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; letter-spacing: 0.05em; }
        .dc-val { font-size: 0.875rem; font-weight: 600; }
        .text-green { color: #16a34a; }
        
        .crypto-card { border: 1px solid #e2e8f0; border-radius: 8px; text-align: left; padding: 20px; }
        .crypto-title { font-size: 0.65rem; font-weight: 700; color: #64748b; margin-bottom: 16px; display: flex; align-items: center; gap: 6px; letter-spacing: 0.05em; }
        
        .crypto-row { display: flex; align-items: center; margin-bottom: 12px; }
        .crypto-row:last-child { margin-bottom: 0; }
        .cr-label { width: 120px; font-size: 0.75rem; color: #64748b; }
        .cr-val { flex: 1; background: #f8fafc; border: 1px solid #e2e8f0; padding: 8px 12px; border-radius: 4px; font-family: monospace; font-size: 0.75rem; display: flex; justify-content: space-between; align-items: center; }
        .cr-copy { cursor: pointer; color: #64748b; }
        .btn-back { display: inline-flex; align-items: center; gap: 6px; font-size: 0.875rem; font-weight: 600; color: #475569; text-decoration: none; padding: 6px 12px; border-radius: 6px; background: #f8fafc; transition: all 0.2s ease; border: 1px solid #e2e8f0; }
        .btn-back:hover { background: #e2e8f0; color: #0f172a; }
        .btn-primary { display: inline-flex; justify-content: center; align-items: center; gap: 8px; width: 100%; background: #0f172a; color: white; border: none; padding: 14px; border-radius: 6px; font-weight: 600; font-size: 1rem; cursor: pointer; text-decoration: none; margin-top: 16px; transition: background 0.2s; }
        .btn-primary:hover { background: #1e293b; }
        
        .actions { display: flex; justify-content: center; gap: 16px; }
        .btn-dark { background: #0f172a; color: white; padding: 12px 24px; border-radius: 6px; font-weight: 600; text-decoration: none; border: none; font-size: 0.875rem; display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .btn-light { background: #eff6ff; color: #1e3a8a; padding: 12px 24px; border-radius: 6px; font-weight: 600; text-decoration: none; border: 1px solid #bfdbfe; font-size: 0.875rem; display: flex; align-items: center; gap: 8px; cursor: pointer; }
        
        @media (max-width: 480px) {
            .btn-back span { display: none; }
            .btn-back { padding: 10px; border-radius: 50%; }
            .btn-back svg { margin: 0; }
            .dc-grid { grid-template-columns: 1fr; }
            .dc-cell { border-right: none; border-bottom: 1px solid #e2e8f0; }
            .dc-cell:last-child { border-bottom: none; }
            .actions { flex-direction: column; }
            .actions button { width: 100%; justify-content: center; }
            .crypto-row { flex-direction: column; align-items: flex-start; gap: 6px; }
            .cr-val { width: 100%; box-sizing: border-box; }
            .header { padding: 12px 16px; }
            .content { padding: 24px; }
        }
    </style>
</head>
<body>
    
    <div class="result-container">
        <div class="header" style="display: flex; justify-content: space-between; align-items: center;">
            <span>TrueMark</span>
            <a href="verify.html" class="btn-back">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                <span>Scan Another</span>
            </a>
        </div>
        <div class="content">
            <div class="icon-success">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            </div>
            
            <h1 class="status-title" id="vr-status-title">Loading...</h1>
            <p class="status-desc" id="vr-status-desc">Fetching cryptographic proof from the ledger...</p>
            
            <div class="details-card">
                <div class="dc-header">
                    <div class="dc-avatar">AS</div>
                    <div>
                        <div class="dc-name-label">STUDENT NAME</div>
                        <div class="dc-name-val" id="vr-student-name">-</div>
                    </div>
                </div>
                <div class="dc-grid">
                    <div class="dc-cell">
                        <div class="dc-label">ROLL NO</div>
                        <div class="dc-val" id="vr-roll-no">-</div>
                    </div>
                    <div class="dc-cell">
                        <div class="dc-label">DEGREE</div>
                        <div class="dc-val" id="vr-degree">-</div>
                    </div>
                </div>
                <div class="dc-grid">
                    <div class="dc-cell">
                        <div class="dc-label">TRUE CGPA</div>
                        <div class="dc-val text-green" id="vr-cgpa">-</div>
                    </div>
                    <div class="dc-cell">
                        <div class="dc-label">DATE OF ISSUE</div>
                        <div class="dc-val" id="vr-issue-date">-</div>
                    </div>
                </div>
            </div>
            
            <div class="crypto-card">
                <div class="crypto-title">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                    CRYPTOGRAPHIC EVIDENCE
                </div>
                <div class="crypto-row">
                    <div class="cr-label">Block Hash</div>
                    <div class="cr-val" id="vr-block-hash" style="word-break: break-all;">
                        -
                    </div>
                </div>
                <div class="crypto-row">
                    <div class="cr-label">Transaction ID</div>
                    <div class="cr-val" id="vr-cred-id" style="word-break: break-all;">
                        -
                    </div>
                </div>
            </div>
            
            <a href="verify.html" class="btn-primary">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5c0-1.1.9-2 2-2h2"/><path d="M17 3h2c1.1 0 2 .9 2 2v2"/><path d="M21 17v2c0 1.1-.9 2-2 2h-2"/><path d="M7 21H5c-1.1 0-2-.9-2-2v-2"/><rect x="7" y="7" width="10" height="10" rx="2"/></svg>
                Verify Another Credential
            </a>
        </div>
    </div>
    
    <div class="actions">
        <button class="btn-dark">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
            Download Official PDF
        </button>
        <button class="btn-light">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
            Print Verification Report
        </button>
    </div>


    <script>
        const API_BASE_URL = window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost' 
            ? 'http://127.0.0.1:8000' 
            : 'https://truemark-backend-sih.onrender.com';

        async function fetchVerification() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            
            if (!id) {
                document.getElementById('vr-status-title').textContent = "NO ID PROVIDED";
                document.getElementById('vr-status-desc').textContent = "Please scan a valid QR code or enter a credential ID.";
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/verify/${id}`);
                if (!response.ok) throw new Error("Not Found");
                
                const data = await response.json();
                
                document.getElementById('vr-student-name').textContent = data.credential?.student_name || '-';
                document.getElementById('vr-roll-no').textContent = data.credential?.roll_no || '-';
                document.getElementById('vr-degree').textContent = data.credential?.degree || '-';
                document.getElementById('vr-cgpa').textContent = data.credential?.cgpa || '-';
                document.getElementById('vr-issue-date').textContent = data.credential?.issue_date || '-';
                document.getElementById('vr-block-hash').textContent = data.hash_valid ? 'Valid (SHA-256 Verified)' : 'Invalid';
                document.getElementById('vr-cred-id').textContent = id;
                
                const title = document.getElementById('vr-status-title');
                const desc = document.getElementById('vr-status-desc');
                const icon = document.querySelector('.icon-success');
                
                if (data.status === 'VALID') {
                    title.textContent = "CREDENTIAL VERIFIED";
                    title.style.color = "#16a34a";
                    icon.style.background = "#16a34a";
                    icon.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
                    desc.textContent = `This document matches the blockchain ledger and was officially signed by ${data.credential?.institution_name}.`;
                } else if (data.status === 'REVOKED') {
                    title.textContent = "CREDENTIAL REVOKED";
                    title.style.color = "#dc2626";
                    icon.style.background = "#dc2626";
                    icon.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>`;
                    desc.textContent = `This credential was revoked on ${new Date(data.revocation?.revoked_at).toLocaleDateString()}. Reason: ${data.revocation?.reason}`;
                } else {
                    title.textContent = "TAMPERED / INVALID";
                    title.style.color = "#dc2626";
                    icon.style.background = "#dc2626";
                    icon.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`;
                    desc.textContent = "Cryptographic verification failed. This document is not authentic.";
                }
            } catch (err) {
                const title = document.getElementById('vr-status-title');
                title.textContent = "NOT FOUND";
                title.style.color = "#dc2626";
                document.getElementById('vr-status-desc').textContent = "The credential ID does not exist in the registry.";
                const icon = document.querySelector('.icon-success');
                icon.style.background = "#dc2626";
                icon.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`;
            }
        }
        
        window.onload = fetchVerification;
    </script>
    </body>

</html>
