<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Certify</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/main.css">
    <style>
        body {
            background-color: #f8fafc;
            background-image: 
                linear-gradient(rgba(226, 232, 240, 0.4) 1px, transparent 1px),
                linear-gradient(90deg, rgba(226, 232, 240, 0.4) 1px, transparent 1px);
            background-size: 32px 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: var(--font-body);
        }
        
        .auth-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(226, 232, 240, 0.8);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.04);
            width: 100%;
            max-width: 440px;
            padding: 40px;
            text-align: center;
            box-sizing: border-box;
        }

        .auth-logo {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            margin-bottom: 32px;
        }

        .auth-logo span {
            font-family: var(--font-heading);
            font-weight: 800;
            font-size: 1.75rem;
            color: #0f172a;
        }

        .auth-tabs {
            display: flex;
            background: #f1f5f9;
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 32px;
        }

        .auth-tab {
            flex: 1;
            padding: 10px 0;
            text-align: center;
            font-weight: 600;
            font-size: 0.9rem;
            color: #64748b;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .auth-tab.active {
            background: white;
            color: #0f172a;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: inherit;
            color: #0f172a;
            outline: none;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }

        .form-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.1);
        }

        .auth-btn {
            background: #0f172a;
            color: white;
            border: none;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 8px;
            width: 100%;
        }

        .auth-btn:hover {
            background: #1e293b;
            transform: translateY(-1px);
        }

        .signup-fields {
            display: none;
        }

        .form-footer {
            margin-top: 24px;
            font-size: 0.875rem;
            color: #64748b;
        }
        .form-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }
        .form-footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .auth-container {
                padding: 24px;
                border-radius: 16px;
                margin: 16px;
                width: calc(100% - 32px);
            }
            .auth-logo {
                font-size: 1.5rem;
            }
            .auth-logo svg {
                width: 32px;
                height: 32px;
            }
        }
    </style>
</head>
<body>
    <!-- Toast Notifications Container -->
    <div id="toast-container" class="toast-container"></div>

    <div class="auth-container">
        <!-- Logo -->
        <a href="index.html" class="auth-logo">
            <svg viewBox="0 0 40 40" width="40" height="40" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M8 4 h 16 l 8 8 v 24 h -24 z" fill="#f8fafc" stroke="#0f172a" stroke-width="2.5" stroke-linejoin="round"/>
                <path d="M24 4 v 8 h 8" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linejoin="round"/>
                <path d="M13 22 l 4 4 l 8 -9" fill="none" stroke="#16a34a" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>Certify</span>
        </a>

        <!-- Tabs -->
        <div class="auth-tabs">
            <div class="auth-tab active" id="tab-login" onclick="switchMode('login')">Login</div>
            <div class="auth-tab" id="tab-signup" onclick="switchMode('signup')">Sign Up</div>
        </div>

        <!-- Form -->
        <form class="auth-form" onsubmit="handleAuth(event)">
            <div class="form-group signup-fields">
                <label>Institution Name</label>
                <input type="text" id="instName" placeholder="e.g. National Institute of Technology">
            </div>
            
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" required placeholder="admin@institution.edu">
            </div>
            
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>

            <button type="submit" class="auth-btn" id="submitBtn">Sign In</button>
        </form>

        <div class="form-footer" id="form-footer">
            Don't have an account? <a href="#" onclick="switchMode('signup'); return false;">Sign up here</a>
        </div>
    </div>

    <script src="assets/js/auth.js"></script>

    </body>

</html>
