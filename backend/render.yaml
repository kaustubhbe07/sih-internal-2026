services:
  - type: web
    name: credential-verification-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn -k uvicorn.workers.UvicornWorker app.main:app"
    envVars:
      - key: PYTHON_VERSION
        value: "3.10"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: JWT_SECRET
        sync: false 
      - key: JWT_ALGORITHM
        value: "HS256"
      - key: JWT_EXPIRY_MINUTES
        value: "60"
      - key: FRONTEND_URL
        sync: false
      - key: BASE_URL
        sync: false